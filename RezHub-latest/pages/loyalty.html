<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Rewards — StayBooker</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/api-helper.js" defer></script>
  <style>
    /* Tier card */
    .tier-card {
      border-radius: var(--radius);
      padding: 28px 32px;
      margin-bottom: 16px;
      border: 2px solid transparent;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .tier-card.locked { background: var(--white); border-color: var(--gray-200); opacity: 0.6; }
    .tier-card.locked:hover { opacity: 0.85; }
    .tier-card.active { border-color: currentColor; box-shadow: var(--shadow-md); }
    .tier-card .tier-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 4px 12px;
      border-radius: 20px; margin-bottom: 10px;
    }
    .tier-card .tier-badge .material-icons-round { font-size: 14px; }
    .tier-card h3 { font-size: 1.5rem; margin-bottom: 6px; }
    .tier-card .tier-perks { list-style: none; margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .tier-card .tier-perks li { display: flex; align-items: flex-start; gap: 8px; font-size: 0.875rem; }
    .tier-card .tier-perks li .material-icons-round { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .tier-card .locked-overlay {
      position: absolute; top: 16px; right: 16px;
      display: flex; align-items: center; gap: 5px;
      font-size: 0.75rem; font-weight: 600; color: var(--gray-400);
    }
    .tier-card .locked-overlay .material-icons-round { font-size: 16px; }

    /* Progress bar */
    .progress-wrap { margin: 8px 0 4px; }
    .progress-bg { height: 8px; background: var(--gray-200); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }
    .progress-labels { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--gray-400); margin-top: 5px; }

    /* Stats grid */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 36px; }
    .stat-card {
      background: var(--white); border-radius: var(--radius);
      border: 1px solid var(--gray-200); padding: 24px 20px;
      text-align: center; box-shadow: var(--shadow-sm);
    }
    .stat-card .stat-icon { font-size: 28px; margin-bottom: 10px; display: block; }
    .stat-card .stat-value { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 600; color: var(--navy); line-height: 1; }
    .stat-card .stat-label { font-size: 0.78rem; color: var(--gray-400); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.06em; }

    /* Current tier hero */
    .tier-hero {
      border-radius: 16px; padding: 40px 40px 36px;
      margin-bottom: 36px; position: relative; overflow: hidden;
      background: var(--navy);
    }
    .tier-hero::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 80% 50%, rgba(201,169,110,0.15), transparent 60%);
    }
    .tier-hero-content { position: relative; z-index: 2; }
    .tier-hero h1 { color: var(--white); margin-bottom: 6px; }
    .tier-hero p { color: rgba(255,255,255,0.55); font-size: 0.9rem; margin-bottom: 28px; }

    /* No tier state */
    .no-tier-banner {
      background: var(--navy); border-radius: 16px; padding: 48px 40px;
      text-align: center; margin-bottom: 36px;
    }

    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .tier-hero, .no-tier-banner { padding: 28px 24px; }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">
      <div class="logo-icon"><span class="material-icons-round">hotel</span></div>
      <span class="accent">RezHub</span>
    </a>
    <nav class="nav-links"></nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="mobile-menu" id="mobileMenu"></div>
</header>

<nav class="breadcrumb">
  <div class="container breadcrumb-inner">
    <a href="../index.html">Home</a>
    <span class="material-icons-round sep" style="font-size:12px;">chevron_right</span>
    <span class="current">My Rewards</span>
  </div>
</nav>

<main style="padding:48px 0 80px; min-height:60vh;">
  <div class="container" style="max-width:960px;">
    <div id="loyaltyContent"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <div class="logo" style="margin-bottom:0;">
          <div class="logo-icon"><span class="material-icons-round">hotel</span></div>
          <span class="accent">RezHub</span>
        </div>
        <p>Your trusted partner for luxury hotel reservations across India.</p>
      </div>
      <div class="footer-col"><h4>Company</h4><ul><li><a href="#">About Us</a></li><li><a href="#">Careers</a></li></ul></div>
      <div class="footer-col"><h4>Support</h4><ul><li><a href="#">Help Center</a></li><li><a href="#">Contact Us</a></li></ul></div>
      <div class="footer-col"><h4>Follow Us</h4><ul><li><a href="#">Instagram</a></li><li><a href="#">Twitter / X</a></li></ul></div>
    </div>
    <div class="footer-bottom">© 2026 RezHub. All rights reserved.</div>
  </div>
</footer>

<script src="../js/data.js"></script>
<script>
  document.getElementById('menuToggle').addEventListener('click', () => {
    document.getElementById('mobileMenu').classList.toggle('open');
  });
  requireLogin();
  buildNav('rewards');

  function render() {
    const { totalBookings, totalSpend } = getLoyaltyStats();
    const currentTier = getCurrentTier();
    const nextTier = getNextTier();

    // ── HERO ─────────────────────────────────────────
    let heroHtml = '';

    if (!currentTier) {
      // No tier yet
      heroHtml = `
        <div class="no-tier-banner">
          <span class="material-icons-round" style="font-size:52px;color:var(--gold);display:block;margin-bottom:16px;">military_tech</span>
          <h1 style="color:var(--white);margin-bottom:10px;">Start Your Rewards Journey</h1>
          <p style="color:rgba(255,255,255,0.5);max-width:480px;margin:0 auto 28px;font-size:0.95rem;line-height:1.7;">
            Complete your first booking to unlock Bronze membership and start saving on every stay.
          </p>
          <a href="search.html" class="btn btn-primary btn-lg">
            <span class="material-icons-round">hotel</span>
            Browse Hotels
          </a>
        </div>`;
    } else {
      // Progress to next tier
      let progressHtml = '';
      if (nextTier) {
        const bPct   = Math.min(100, Math.round(totalBookings / nextTier.minBookings * 100));
        const sPct   = nextTier.minSpend > 0 ? Math.min(100, Math.round(totalSpend / nextTier.minSpend * 100)) : 100;
        const overallPct = Math.floor((bPct + sPct) / 2);
        const bRemain = Math.max(0, nextTier.minBookings - totalBookings);
        const sRemain = Math.max(0, nextTier.minSpend - totalSpend);

        progressHtml = `
          <div style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:20px 24px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
              <div style="font-weight:600;color:rgba(255,255,255,0.85);font-size:0.9rem;">
                Progress to <span style="color:${nextTier.color};">${nextTier.name}</span>
              </div>
              <div style="font-size:0.85rem;font-weight:700;color:var(--gold);">${overallPct}%</div>
            </div>
            <div class="progress-bg" style="margin-bottom:12px;">
              <div class="progress-fill" id="mainProgressFill" style="width:0%;background:${nextTier.color};"></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px;">
              <div>
                <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.07em;color:rgba(255,255,255,0.4);margin-bottom:6px;">Bookings</div>
                <div class="progress-bg"><div class="progress-fill" id="bookProgressFill" style="width:0%;background:var(--gold);"></div></div>
                <div style="font-size:0.78rem;color:rgba(255,255,255,0.5);margin-top:4px;">${totalBookings} / ${nextTier.minBookings} — ${bRemain > 0 ? bRemain + ' more needed' : '✓ Done'}</div>
              </div>
              <div>
                <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.07em;color:rgba(255,255,255,0.4);margin-bottom:6px;">Total Spend</div>
                <div class="progress-bg"><div class="progress-fill" id="spendProgressFill" style="width:0%;background:var(--gold);"></div></div>
                <div style="font-size:0.78rem;color:rgba(255,255,255,0.5);margin-top:4px;">${formatINR(totalSpend)} / ${formatINR(nextTier.minSpend)} — ${sRemain > 0 ? formatINR(sRemain) + ' more' : '✓ Done'}</div>
              </div>
            </div>
          </div>`;

        // Animate progress bars after render
        setTimeout(() => {
          document.getElementById('mainProgressFill').style.width = overallPct + '%';
          document.getElementById('bookProgressFill').style.width = bPct + '%';
          document.getElementById('spendProgressFill').style.width = sPct + '%';
        }, 150);
      } else {
        progressHtml = `
          <div style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:18px 24px;display:flex;align-items:center;gap:12px;">
            <span class="material-icons-round" style="font-size:24px;color:var(--gold);">workspace_premium</span>
            <div>
              <div style="font-weight:700;color:var(--gold);">You've reached Platinum — the highest tier!</div>
              <div style="font-size:0.82rem;color:rgba(255,255,255,0.5);margin-top:3px;">Every booking earns maximum rewards. Thank you for your loyalty.</div>
            </div>
          </div>`;
      }

      heroHtml = `
        <div class="tier-hero" style="--tier-color:${currentTier.color};">
          <div class="tier-hero-content">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
              <span class="material-icons-round" style="font-size:44px;color:${currentTier.color};">${currentTier.icon}</span>
              <div>
                <div style="font-size:0.72rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:4px;">Your Status</div>
                <h1 style="color:var(--white);font-size:2.4rem;">${currentTier.name} Member</h1>
              </div>
            </div>
            <p>${currentTier.discount}% discount applied automatically to every booking you make.</p>
            ${progressHtml}
          </div>
        </div>`;
    }

    // ── STATS ─────────────────────────────────────────
    const totalSaved = getBookings().reduce((sum, b) => {
      // Estimate savings (discount would have been applied at time of booking)
      const tier = LOYALTY_TIERS.find(t => t.id === (b.tierAtBooking || ''));
      return sum + (b.loyaltySaving || 0);
    }, 0);

    const statsHtml = `
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-icon">🏨</span>
          <div class="stat-value">${totalBookings}</div>
          <div class="stat-label">Total Bookings</div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">💰</span>
          <div class="stat-value">${formatINR(totalSpend)}</div>
          <div class="stat-label">Total Spent</div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">🎁</span>
          <div class="stat-value">${formatINR(totalSaved)}</div>
          <div class="stat-label">Total Saved</div>
        </div>
      </div>`;

    // ── ALL TIERS ─────────────────────────────────────
    const allTiersHtml = LOYALTY_TIERS.map(tier => {
      const isActive = currentTier && tier.id === currentTier.id;
      const isPast   = currentTier && LOYALTY_TIERS.findIndex(t=>t.id===tier.id) < LOYALTY_TIERS.findIndex(t=>t.id===currentTier.id);
      const isLocked = !isActive && !isPast;

      const perksHtml = tier.perks.map(p => `
        <li>
          <span class="material-icons-round" style="color:${isLocked ? 'var(--gray-400)' : tier.color};">check_circle</span>
          <span style="color:${isLocked ? 'var(--gray-400)' : 'var(--gray-600)'};">${p}</span>
        </li>`).join('');

      const discountBadge = `<span style="font-size:1.6rem;font-family:'Cormorant Garamond',serif;font-weight:600;color:${isLocked ? 'var(--gray-400)' : tier.color};">${tier.discount}% off</span>`;

      return `
        <div class="tier-card ${isLocked ? 'locked' : 'active'}" style="background:${isLocked ? 'var(--white)' : tier.colorLight};border-color:${isLocked ? 'var(--gray-200)' : tier.color}40;color:${tier.color};">
          ${isLocked ? `<div class="locked-overlay"><span class="material-icons-round">lock</span> Locked</div>` : ''}
          ${isActive ? `<div style="position:absolute;top:16px;right:16px;background:${tier.color};color:#fff;font-size:0.7rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:4px 10px;border-radius:20px;">Current Tier</div>` : ''}
          ${isPast ? `<div style="position:absolute;top:16px;right:16px;background:var(--green-light);color:var(--green);font-size:0.7rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:4px;"><span class="material-icons-round" style="font-size:13px;">check</span>Achieved</div>` : ''}
          <div class="tier-badge" style="background:${tier.color}20;color:${isLocked ? 'var(--gray-400)' : tier.color};">
            <span class="material-icons-round">${tier.icon}</span> ${tier.name}
          </div>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
              <h3 style="color:${isLocked ? 'var(--gray-400)' : 'var(--navy)'};">${tier.name} Membership</h3>
              <div style="font-size:0.82rem;color:var(--gray-400);margin-top:2px;">
                ${tier.minBookings} bookings · ${formatINR(tier.minSpend)} spend
              </div>
            </div>
            ${discountBadge}
          </div>
          <ul class="tier-perks">
            ${perksHtml}
          </ul>
        </div>`;
    }).join('');

    // ── RECENT HISTORY ────────────────────────────────
    const bookings = getBookings().slice(0, 5);
    const historyHtml = bookings.length ? `
      <div style="background:var(--white);border-radius:var(--radius);border:1px solid var(--gray-200);padding:28px 32px;box-shadow:var(--shadow-sm);">
        <h2 style="margin-bottom:20px;">Recent Bookings</h2>
        ${bookings.map(b => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--gray-200);">
            <div>
              <div style="font-weight:600;color:var(--navy);font-size:0.9rem;">${b.hotelName}</div>
              <div style="font-size:0.78rem;color:var(--gray-400);margin-top:2px;">${formatDate(b.checkIn)} — ${b.roomName}</div>
            </div>
            <div style="text-align:right;">
              <div style="font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--gold);">${formatINR(b.grandTotal)}</div>
              ${b.loyaltySaving ? `<div style="font-size:0.72rem;color:var(--green);font-weight:600;">Saved ${formatINR(b.loyaltySaving)}</div>` : ''}
            </div>
          </div>`).join('')}
        <a href="mybookings.html" style="display:block;text-align:center;margin-top:20px;font-size:0.85rem;font-weight:600;color:var(--gold);">View all bookings →</a>
      </div>` : '';

    document.getElementById('loyaltyContent').innerHTML = `
      ${heroHtml}
      ${statsHtml}
      <h2 style="margin-bottom:20px;">All Membership Tiers</h2>
      <div style="display:flex;flex-direction:column;gap:0;">${allTiersHtml}</div>
      ${bookings.length ? `<div style="margin-top:36px;">${historyHtml}</div>` : ''}
      <div style="margin-top:40px;background:var(--navy);border-radius:var(--radius);padding:32px;text-align:center;">
        <h2 style="color:var(--white);margin-bottom:8px;">Ready to earn more rewards?</h2>
        <p style="color:rgba(255,255,255,0.5);margin-bottom:24px;font-size:0.9rem;">Every booking brings you closer to the next tier.</p>
        <a href="search.html" class="btn btn-primary btn-lg">
          <span class="material-icons-round">hotel</span> Browse Hotels
        </a>
      </div>`;
  }

  render();
</script>
</body>
</html>
